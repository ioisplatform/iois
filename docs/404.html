<!DOCTYPE html>
<html lang="hi">
  <head>
    <meta charset="utf-8" />
    <title>IOIS PLATFORM - Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // MIT License https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query or hash, and then redirects the browser
      // back to the root index.html so the single-page React app can route correctly.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/#' + (path || 'home');
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body style="background-color: #020617; color: #f8fafc; font-family: system-ui, sans-serif; text-align: center; padding: 40px;">
    <h2 style="color: #D4AF37;">IOIS PLATFORM</h2>
    <p>रीडायरेक्ट किया जा रहा है, कृपया प्रतीक्षा करें...</p>
  </body>
</html>
