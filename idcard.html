<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>IOIS Platinum Digital ID</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  body { background:#1a1a1a; display:flex; flex-direction:column; align-items:center; padding:20px; font-family:'Segoe UI'; }

  /* PLATINUM 3D CARD */
 .card {
    width: 400px; height: 640px; /* PVC Size */
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.8) 0%, transparent 50%),
      linear-gradient(135deg, #E0E0E0 0%, #C0C0C0 25%, #E8E8E8 50%, #B0B0B0 75%, #D0D0D0 100%);
    border-radius: 20px;
    box-shadow:
      0 20px 50px rgba(0,0,0,0.5),
      inset 0 1px 1px rgba(255,255,255,0.8);
    border: 2px solid #A0A0A0;
    padding: 0;
    position: relative;
    overflow: hidden;
    transform: perspective(1000px) rotateX(5deg);
  }

  /* GOVERNMENT PATTERN */
 .card::before {
    content: "";
    position: absolute;
    top:0; left:0; right:0; bottom:0;
    background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 50 Q 25 0, 50 50 T 100 50' stroke='%23ccc' fill='none' stroke-width='0.5'/%3E%3C/svg%3E");
    opacity: 0.3;
  }

 .top-bar { background: linear-gradient(90deg, #FF9933, #FFFFFF, #138808); height: 8px; }
 .header { text-align:center; padding:10px; background: rgba(0,0,128,0.9); color:white; }
 .logo { width:60px; filter: drop-shadow(0 0 5px gold); }
  h1 { margin:5px 0; font-size:20px; letter-spacing:1px; }

 .content { padding:15px; color:#000; }
 .photo-box {
    width:110px; height:140px;
    border:3px solid #000080; border-radius:8px;
    float:right; margin-left:10px; background:#ddd; overflow:hidden;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  }
 .photo-box img { width:100%; height:100%; object-fit:cover; }

 .details { clear:both; margin-top:10px; }
 .details p {
    margin:8px 0; font-size:14px;
    border-bottom:1px solid #ccc; padding-bottom:5px;
    font-weight:600;
  }
 .label { color:#000080; font-size:12px; }

 .qr { width:90px; height:90px; background:white; padding:3px; border:1px solid #000; float:left; margin-right:10px; }

 .footer { text-align:center; padding:8px; background:#000080; color:white; font-size:11px; position:absolute; bottom:0; width:100%; }

  /* FORM */
 .form { margin-top:20px; background:#fff; padding:15px; border-radius:10px; color:#000; width:400px; box-shadow:0 5px 20px rgba(0,0,0,0.3); }
 .form input { width:95%; padding:8px; margin:5px 0; border-radius:5px; border:1px solid #ccc; }
 .btn { margin:5px; padding:10px 20px; background: linear-gradient(90deg, #FF9933, #138808); color:white; border:none; border-radius:8px; font-size:15px; cursor:pointer; font-weight:bold; }
</style>
</head>
<body>

<h2 style="color:white;">IOIS Platinum Digital ID Maker</h2>

<!-- FORM -->
<div class="form">
  <input type="text" id="name" placeholder="नाम / Full Name" value="Rahul Kumar">
  <input type="text" id="ioisid" placeholder="IOIS ID" value="IOIS10DSK1">
  <input type="text" id="jdate" placeholder="Date of Joining" value="09/02/2026">
  <input type="email" id="email" placeholder="Email ID">
  <input type="file" id="photoUpload" accept="image/*">
  <br>
  <button class="btn" onclick="updateCard()">Update Card</button>
  <button class="btn" onclick="downloadPNG()">Download PNG</button>
  <button class="btn" onclick="downloadPDF()">Download PDF</button>
</div>

<!-- CARD -->
<div class="card" id="idcard">
  <div class="top-bar"></div>
  <div class="header">
    <img src="IOIS_LOGO.png" class="logo">
    <h1>IOIS PLATFORM</h1>
    <p style="margin:0; font-size:12px;">INDIAN ONLINE INCOME SUPPORTING SYSTEM</p>
  </div>

  <div class="content">
    <div class="photo-box">
      <img id="userPhoto" src="https://via.placeholder.com/110x140.png?text=PHOTO">
    </div>

    <div class="details">
      <p><span class="label">नाम / NAME</span><br><span id="cname">RAHUL KUMAR</span></p>
      <p><span class="label">IOIS ID</span><br><span id="cid">IOIS10DSK1</span></p>
      <p><span class="label">जॉइनिंग तिथि / D.O.J</span><br><span id="cdate">09/02/2026</span></p>
      <p><span class="label">ईमेल / EMAIL</span><br><span id="cemail">-</span></p>
    </div>

    <div class="qr">
      <img id="qrCode" src="" width="90">
    </div>
    <p style="font-size:10px; color:#555;">This is a digitally issued ID card by IOIS Platform. Verify at: iois.org</p>
  </div>

  <div class="footer">
    🇮🇳 GOVERNMENT RECOGNIZED DIGITAL IDENTITY 🇮🇳
  </div>
</div>

<script>
function updateCard(){
  document.getElementById('cname').innerText = document.getElementById('name').value.toUpperCase();
  document.getElementById('cid').innerText = document.getElementById('ioisid').value;
  document.getElementById('cdate').innerText = document.getElementById('jdate').value;
  document.getElementById('cemail').innerText = document.getElementById('email').value;

  let qrData = document.getElementById('ioisid').value;
  document.getElementById('qrCode').src = `https://api.qrserver.com/v1/create-qr-code/?size=90x90&data=${qrData}`;
}

document.getElementById('photoUpload').onchange = function(e){
  let reader = new FileReader();
  reader.onload = function(event){
    document.getElementById('userPhoto').src = event.target.result;
  }
  reader.readAsDataURL(e.target.files[0]);
}

async function downloadPNG(){
  const card = document.getElementById('idcard');
  const canvas = await html2canvas(card, {scale: 3});
  let link = document.createElement('a');
  link.download = 'IOIS_Platinum_ID.png';
  link.href = canvas.toDataURL();
  link.click();
}

async function downloadPDF(){
  const card = document.getElementById('idcard');
  const canvas = await html2canvas(card, {scale: 3});
  const imgData = canvas.toDataURL('image/png');
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p', 'mm', [85.6, 54]); // Credit Card Size
  pdf.addImage(imgData, 'PNG', 0, 0, 85.6, 54);
  pdf.save('IOIS_Platinum_ID.pdf');
}

updateCard();
</script>

</body>
</html>
